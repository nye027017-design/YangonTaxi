<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yangon Taxi - Admin</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <section id="auth" class="auth hidden">
    <h1>Admin</h1>
    <form id="loginForm">
      <input id="phone" type="tel" placeholder="ဖုန်းနံပါတ်" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">ဝင်မယ်</button>
    </form>
    <form id="setupForm" class="hidden">
      <p>Admin ပထမဆုံးတစ်ယောက် ဖန်တီးခြင်း (တစ်ကြိမ်သာ)</p>
      <input id="sKey" type="password" placeholder="ADMIN_SETUP_KEY (Secret ထဲက စာသား)" required>
      <input id="sName" placeholder="နာမည်" required>
      <input id="sPhone" type="tel" placeholder="ဖုန်းနံပါတ်" required>
      <input id="sPass" type="password" placeholder="Password (၈ လုံးအထက်)" required>
      <button type="submit">Admin ဖန်တီးမယ်</button>
    </form>
    <p id="authMsg" class="msg"></p>
    <button id="toggleSetup" class="link">Admin အကောင့် မရှိသေးဘူး - ဖန်တီးမယ်</button>
  </section>

  <section id="app" class="hidden">
    <header><b>Yangon Taxi Admin</b>
      <span><button id="refresh" class="link">Refresh</button><button id="logout" class="link">ထွက်မယ်</button></span>
    </header>
    <nav>
      <button data-tab="summary" class="on">ခြုံငုံ</button>
      <button data-tab="drivers">Driver</button>
      <button data-tab="bookings">ခရီးစဉ်</button>
      <button data-tab="fares">စျေးနှုန်း</button>
    </nav>
    <main id="content"></main>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
