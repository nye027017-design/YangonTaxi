<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b9d58">
  <title>Yangon Taxi - Driver</title>
  <link rel="icon" href="../customer/icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<section id="auth" class="auth hidden">
  <div class="hero">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M5 11l1.6-4.4A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.6L19 11M4 11h16v6H4zM7 17v2M17 17v2"/></svg></div>
    <h1>Yangon Taxi</h1><p>Driver</p>
  </div>
  <form id="authForm" class="formcard">
    <input id="name" placeholder="နာမည်" class="hidden">
    <input id="phone" type="tel" placeholder="ဖုန်းနံပါတ် (09...)" required>
    <input id="password" type="password" placeholder="Password" required>
    <select id="vehicle" class="hidden"><option value="taxi">Taxi</option><option value="car">Car</option><option value="bike">Bike</option></select>
    <input id="plate" placeholder="ကားနံပါတ်" class="hidden">
    <button id="authBtn" class="primary" type="submit">ဝင်မယ်</button>
    <p id="authMsg" class="msg"></p>
  </form>
  <button id="toggleAuth" class="link">Driver အဖြစ် စာရင်းသွင်းမယ်</button>
</section>

<section id="app" class="hidden" data-v="Idle">
  <div id="map"></div>
  <div class="hud">
    <div id="stat" class="stat"><i></i><span id="statTxt">Offline</span></div>
    <div id="earnChip" class="chip">ဒီနေ့ 0 ကျပ်</div>
  </div>

  <div class="sheet">
    <button id="gps" class="fab loc" aria-label="GPS"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
    <button id="onlineBtn" class="go">GO</button>

    <div id="vIdle">
      <div class="idle"><b id="idleTitle">Offline ဖြစ်နေပါတယ်</b><small id="idleSub">GO ကိုနှိပ်ပြီး ခရီးစဉ်တွေ စတင်စောင့်ပါ</small></div>
      <div id="reqList" class="reqs"></div>
      <p id="reqMsg" class="msg"></p>
      <div class="mini"><div><b id="mTrips">0</b><small>ဒီနေ့ ခရီး</small></div><div><b id="mFare">0</b><small>ဒီနေ့ ကောက်ခံငွေ (ကျပ်)</small></div></div>
    </div>

    <div id="vTrip" class="hidden">
      <div class="steps"><i></i><u></u><i></i><u></u><i></i></div>
      <p id="tripStatus" class="ttl"></p>
      <div class="cust">
        <div id="avatar" class="avatar"></div>
        <div class="grow"><b id="cName"></b><small id="cInfo"></small></div>
        <a id="callBtn" class="round" aria-label="ဖုန်းဆက်"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>
      </div>
      <div class="rt"><div><i class="dot g"></i><span id="rtFrom"></span></div><div><i class="dot r"></i><span id="rtTo"></span></div></div>
      <div class="two"><a id="navBtn" class="ghost" target="_blank" rel="noopener">လမ်းညွှန်</a><button id="releaseBtn" class="ghost warn">ပြန်လွှတ်မယ်</button></div>
      <button id="nextBtn" class="primary"></button>
      <p id="tripMsg" class="msg"></p>
    </div>

    <div id="vDone" class="hidden center">
      <div class="okc"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>ခရီးပြီးဆုံးပါပြီ!</h2>
      <p class="sub">ခရီးသည်ဆီက ကောက်ခံရန်</p>
      <p id="dnFare" class="big"></p>
      <button id="doneBtn" class="primary">ပြီးပါပြီ</button>
    </div>
  </div>

  <nav id="nav" class="nav">
    <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
    <button data-t="earn"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>ဝင်ငွေ</button>
    <button data-t="acct"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Account</button>
  </nav>
  <section id="panel" class="panel hidden"><h2 id="panelTitle"></h2><div id="panelBody"></div></section>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
