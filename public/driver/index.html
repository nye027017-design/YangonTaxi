<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yangon Taxi - Driver</title>
  <meta name="theme-color" content="#0a5c33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taxi Driver">
  <link rel="manifest" href="/driver/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/driver/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/driver/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/driver/css/app.css">
</head>
<body>
  <section id="auth" class="auth hidden">
    <div class="auth-head">
      <img src="/driver/icons/icon-192.png" alt="" width="64" height="64">
      <h1>Yangon Taxi Driver</h1>
      <p>ယာဉ်မောင်း App</p>
    </div>
    <form id="authForm" class="auth-card">
      <input id="name" placeholder="နာမည်" autocomplete="name" class="hidden">
      <input id="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="ဖုန်းနံပါတ် (09...)" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <select id="vehicle" class="hidden">
        <option value="taxi">Taxi</option>
        <option value="bike">Bike</option>
      </select>
      <input id="plate" placeholder="ကားနံပါတ်" class="hidden">
      <button id="authBtn" class="primary" type="submit">ဝင်မယ်</button>
      <p id="authMsg" class="msg" role="alert"></p>
      <button id="toggleAuth" type="button" class="link">Driver အဖြစ် စာရင်းသွင်းမယ်</button>
      <button type="button" class="link hidden" data-install>📲 ဖုန်းထဲသို့ App ထည့်သွင်းရန်</button>
      <p class="sub center hidden" data-ios-hint>iPhone: Safari ရဲ့ Share ခလုတ်ကို နှိပ်ပြီး "Add to Home Screen" ကို ရွေးပါ။</p>
    </form>
  </section>

  <section id="app" class="hidden">
    <header>
      <div class="who"><b>Driver</b><small id="stateTxt">Offline</small></div>
      <div class="right">
        <button id="onlineBtn">Offline</button>
        <button id="logout" class="link">ထွက်မယ်</button>
      </div>
    </header>
    <div id="map"></div>

    <div id="reqPanel" class="panel">
      <div class="grab"></div>
      <p id="reqHint" class="hint">Online ဖွင့်ပြီး ခရီးစဉ်တွေ စောင့်ပါ</p>
      <div id="reqList" class="reqs"></div>
      <p id="reqMsg" class="msg"></p>
    </div>

    <div id="tripPanel" class="panel hidden">
      <div class="grab"></div>
      <h2 id="tripStatus"></h2>
      <p id="tripInfo" class="info"></p>
      <a id="callBtn" class="btn-out hidden">📞 ခရီးသည်ကို ဖုန်းဆက်မယ်</a>
      <button id="nextBtn" class="primary"></button>
      <button id="releaseBtn" class="danger">ပြန်လွှတ်မယ်</button>
      <p id="tripMsg" class="msg"></p>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/driver/js/main.js"></script>
</body>
</html>
