<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yangon Taxi</title>
  <meta name="theme-color" content="#0b9d58">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash" class="splash">
  <div class="sp-top"><div class="logo"><svg viewBox="0 0 24 24"><path d="M5 11l1.6-4.4A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.6L19 11M4 11h16v6H4zM7 17v2M17 17v2"/></svg></div><h1>Yangon Taxi</h1></div>
  <svg class="sp-art" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice"><g fill="#fff" fill-opacity=".16"><path d="M0 140V110l20-8v-20l10-6 10 6v20l16 6v32zM330 140v-30l18-10V84l12-8 12 8v16l18 10v30z"/><path d="M170 140v-18h60v18zM178 122v-16h44v16zM186 106V92h28v14zM194 92V74h12v18zM200 74V40M200 40l-3 8h6z" stroke="#fff" stroke-opacity=".3"/><path d="M90 140v-24h24v24zM286 140v-20h26v20z"/></g><path d="M0 140h400v-6H0z" fill="#fff" fill-opacity=".25"/></svg>
  <div class="sp-bot"><p class="tag">Move Smarter<br>Live Better</p><button id="spGo" class="sp-btn">စတင်မယ်</button><button id="spLogin" class="sp-link">ဝင်မယ်</button></div>
</div>
<section id="auth" class="auth hidden">
  <h1>Yangon Taxi</h1>
  <p class="sub">ရန်ကုန်မှာ ကားခေါ်ရတာ လွယ်ပါတယ်</p>
  <form id="authForm">
    <input id="name" placeholder="နာမည်" class="hidden">
    <input id="phone" type="tel" placeholder="ဖုန်းနံပါတ် (09...)" required>
    <input id="password" type="password" placeholder="Password" required>
    <button id="authBtn" class="primary" type="submit">ဝင်မယ်</button>
    <p id="authMsg" class="msg"></p>
  </form>
  <button id="toggleAuth" class="link">စာရင်းသွင်းမယ်</button>
</section>

<section id="app" class="hidden">
  <div id="map"></div>
  <div class="topbar"><button id="menuBtn" class="fab" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="city">Yangon ⌄</span><button id="bell" class="fab" aria-label="Promotions"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg></button></div>
  <button id="logout" class="hidden" aria-label="ထွက်မယ်"><svg viewBox="0 0 24 24"><path d="M16 17l5-5-5-5M21 12H9M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg></button>
  <div id="pill" class="pill hidden"></div>
  <div class="search"><svg class="mg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="ဘယ်သွားမလဲ?" autocomplete="off"><div id="results" class="results hidden"></div></div>
  <div id="centerPin" class="cpin hidden"><svg viewBox="0 0 24 32"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z"/><circle cx="12" cy="12" r="4.5" fill="#fff" stroke="none"/></svg></div>

  <div class="sheet">
    <button id="gps" class="fab loc" aria-label="GPS"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
    <div class="grab"></div>

    <div id="vBook">
      <div class="route">
        <button id="rowPick" class="rrow on"><i class="dot g"></i><span><small>ခေါ်မယ့်နေရာ</small><b id="pickTxt"></b></span></button>
        <button id="rowDrop" class="rrow"><i class="dot r"></i><span><small>သွားမယ့်နေရာ</small><b id="dropTxt"></b></span></button>
      </div>
      <button id="homeCard" class="homecard"><span class="hi"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></span><span class="ht"><b>Home</b><small id="homeSub">တစ်ခါသိမ်း၊ မြန်မြန်သွား</small></span></button>
      <p id="tripDist" class="dist hidden"></p>
      <div class="opts">
        <button class="opt on" data-v="taxi"><svg class="vi" viewBox="0 0 24 24"><path d="M5 12l1.6-4.4A2 2 0 0 1 8.5 6h7a2 2 0 0 1 1.9 1.6L19 12M3 12h18v5H3zM7 17v2M17 17v2"/></svg><b>Taxi</b><span class="p">-</span><small class="k"></small></button>
        <button class="opt" data-v="car"><svg class="vi" viewBox="0 0 24 24"><path d="M5 12l1.6-4.4A2 2 0 0 1 8.5 6h7a2 2 0 0 1 1.9 1.6L19 12M3 12h18v5H3zM7 17v2M17 17v2"/></svg><b>Car</b><span class="p">-</span><small class="k"></small></button>
        <button class="opt" data-v="bike"><svg class="vi" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-7h5l3 7M10 10L9 7H7M13 6h3"/></svg><b>Bike</b><span class="p">-</span><small class="k"></small></button>
      </div>
      <p class="pay">ငွေပေးချေမှု - ငွေသား</p>
      <button id="bookBtn" class="primary" disabled>Book Ride</button>
      <p id="bookMsg" class="msg"></p>
    </div>

    <div id="vPick" class="hidden">
      <p id="pickTitle" class="sub"></p>
      <p id="pickAddr" class="place"></p>
      <p id="pickDist" class="dist"></p>
      <button id="confirmPick" class="primary">ဒီနေရာကို ရွေးမယ်</button>
      <button id="backPick" class="cancel">နောက်ပြန်</button>
    </div>

    <div id="vSearch" class="hidden center">
      <div class="radar"><i></i><i></i><i></i><div class="core"><svg viewBox="0 0 24 24"><path d="M5 11l1.6-4.4A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.6L19 11M4 11h16v6H4zM7 17v2M17 17v2"/></svg></div></div>
      <h2>Driver ရှာနေပါတယ်...</h2>
      <p class="sub">အနီးအနားက Driver တွေ လာနေပါပြီ</p>
      <button class="cancel" data-cancel>Cancel Booking</button>
    </div>

    <div id="vTrip" class="hidden">
      <div class="drv"><!-- centered -->
        <div id="avatar" class="avatar"></div>
        <div class="grow"><b id="dName"></b><small id="dPlate"></small></div>
        <a id="callBtn" class="round" aria-label="ဖုန်းဆက်"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>
      </div>
      <div class="acts">
        <a id="callBtn2" class="act"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>ဖုန်းခေါ်</a>
        <a id="smsBtn" class="act"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.2A8 8 0 1 1 21 12z"/></svg>Message</a>
        <button id="shareBtn" class="act"><svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"/></svg>Share</button>
      </div>
      <p id="tripFare" class="fare"></p>
      <div id="arrive" class="arrive">Arriving Soon</div>
      <button id="cancelTrip" class="cancel" data-cancel>ပယ်ဖျက်မယ်</button>
    </div>

    <div id="vDone" class="hidden center">
      <div class="okc"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>ခရီးပြီးဆုံးပါပြီ!</h2>
      <p id="dnInfo" class="sub"></p>
      <p id="dnFare" class="big"></p>
      <p class="paid">ငွေသားဖြင့် ပေးချေ</p>
      <p class="sub">ခရီးစဉ်ကို အမှတ်ပေးပါ</p>
      <div id="stars" class="stars"><button>★</button><button>★</button><button>★</button><button>★</button><button>★</button></div>
      <button id="doneBtn" class="primary">ပြီးပါပြီ</button>
    </div>
  </div>
<nav id="nav" class="nav">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
  <button data-t="trips"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Activity</button>
  <button data-t="promo"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8zM7.5 8.5h.01"/></svg>Promotions</button>
  <button data-t="acct"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Account</button>
</nav>
<section id="panel" class="panel hidden"><h2 id="panelTitle"></h2><div id="panelBody"></div></section>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
