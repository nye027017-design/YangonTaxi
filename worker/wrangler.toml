name = "yangon-taxi"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
DEBUG = "1"   # Error အကြောင်းရင်းပြဖို့။ အားလုံးအဆင်ပြေရင် "0" ပြောင်းပါ

[[d1_databases]]
binding = "DB"
database_name = "yangontaxi-db"
database_id = "fa29ca2b-57e2-4b7b-a770-14eea29c7220"
migrations_dir = "migrations"
